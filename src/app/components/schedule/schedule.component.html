<div class="schedule-container">
  <h1 class="title">2026 Tournament Schedule</h1>

  <div class="tournament-grid">
    <div *ngFor="let tournament of tournaments">
      <div class="tournament">
        <div class="tournament-date">{{ tournament.date | date: 'MMMM d' }}</div>
        <div class="tournament-format">{{ tournament.format }}</div>

        <!-- Only show the Sign Up button if the tournament is in the future -->
        <button *ngIf="tournament.canSignUp" class="signup-btn" (click)="onSignUp(tournament.date)">
          Tee Sheet
        </button>
        <button *ngIf="!tournament.canSignUp" class="result-btn" (click)="getResults(tournament.date)">
          Results
        </button>
      </div>
    </div>
  </div>

</div>
