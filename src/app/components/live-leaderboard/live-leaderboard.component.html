<div class="leaderboard-container">
  <h2>{{ showNet ? 'Net Leaderboard' : 'Gross Leaderboard' }}</h2>
  <div *ngFor="let player of leaderboard; let i = index" class="leaderboard-row">
    <span class="rank">{{ i + 1 }}.</span>
    <span class="name">{{ player.name }}</span>
    <span class="score" [ngClass]="{'even': player.score === 'E', 'under': +player.score < 0, 'over': +player.score > 0}">
      {{ player.score }}
    </span>
  </div>
</div>
