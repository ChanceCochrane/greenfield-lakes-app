<h3>Submit Name, Group, and Suggested Time Here</h3>
<form (ngSubmit)="submitTeeTime()">
  <label for="name">Name</label>
  <input type="text" id="name" [(ngModel)]="name" name="name" required />

  <label for="group">Group</label>
  <input type="text" id="group" [(ngModel)]="group" name="group" required />

  <label for="timeSuggestion">Time Suggestion</label>
  <input type="text" id="timeSuggestion" [(ngModel)]="timeSuggestion" name="timeSuggestion" required />

  <button type="submit" [disabled]="!name || !group || !timeSuggestion">Submit</button>
</form>

<div class="tee-sheet">
  <h2>Tournament Tee Sheet - {{ tournamentDate | date: 'longDate' }}</h2>
  <div class="tee-time" *ngFor="let slot of teeSheet">
    <div class="time-header">{{ slot.time }} AM</div>
    <div class="players">
    <div class="player" *ngFor="let user of slot.users; let i = index">
      <span class="player-number">{{ i + 1 }}.</span>
      <span class="player-name">{{ user || '' }}</span>
    </div>
  </div>
</div>
